name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MPS Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Verify APK & Generate Step Summary
        run: |
          ls -la build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk
          APK_SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "### 🚀 MPS Android Release APK Generated Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package Name** | \`com.mps.myapplication\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Binary Filename** | \`app-release.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **File Size** | **$APK_SIZE** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Firebase Project** | \`tutorfee-83839\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Direct Download** | [Direct app-release.apk](https://github.com/JRalex07/School_Testing/releases/latest/download/app-release.apk) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 📱 **Direct APK Download**: Clicking [app-release.apk](https://github.com/JRalex07/School_Testing/releases/latest/download/app-release.apk) downloads the standalone APK directly without any zip archive." >> $GITHUB_STEP_SUMMARY

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mps-school-management-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases (Direct .apk Download)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MPS School Management System - Release APK
          body: |
            ### 📱 MPS School Management System (Release Build)
            
            - **Package Name**: `com.mps.myapplication`
            - **Direct APK**: Download `app-release.apk` below directly to your device (no zip extraction needed).
            - **Backend Project**: `tutorfee-83839`
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
